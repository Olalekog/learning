<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155" /></marker><style>.title{font:700 30px Arial;fill:#0f172a}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2;rx:16}.box2{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:16}.box3{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:16}.lbl{font:700 18px Arial;fill:#111827}.sub{font:14px Arial;fill:#334155}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.note{font:13px Arial;fill:#475569}</style></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="55" class="title">Zero Trust User Access Flow</text>
<rect x="40" y="190" width="160" height="105" class="box" rx="16"/>
<text x="120.0" y="222" text-anchor="middle" class="lbl">1. Access Request</text>
<text x="120.0" y="248" text-anchor="middle" class="sub">User requests an</text>
<text x="120.0" y="266" text-anchor="middle" class="sub">application or API</text>
<rect x="250" y="190" width="170" height="105" class="box2" rx="16"/>
<text x="335.0" y="222" text-anchor="middle" class="lbl">2. Authenticate</text>
<text x="335.0" y="248" text-anchor="middle" class="sub">SSO and MFA verify</text>
<text x="335.0" y="266" text-anchor="middle" class="sub">identity</text>
<rect x="470" y="190" width="170" height="105" class="box2" rx="16"/>
<text x="555.0" y="222" text-anchor="middle" class="lbl">3. Check Context</text>
<text x="555.0" y="248" text-anchor="middle" class="sub">Device posture,</text>
<text x="555.0" y="266" text-anchor="middle" class="sub">location, risk,</text>
<text x="555.0" y="284" text-anchor="middle" class="sub">time, behavior</text>
<rect x="690" y="190" width="170" height="105" class="box3" rx="16"/>
<text x="775.0" y="222" text-anchor="middle" class="lbl">4. Policy Decision</text>
<text x="775.0" y="248" text-anchor="middle" class="sub">Grant, deny, or</text>
<text x="775.0" y="266" text-anchor="middle" class="sub">require step-up</text>
<text x="775.0" y="284" text-anchor="middle" class="sub">authentication</text>
<rect x="910" y="190" width="170" height="105" class="box" rx="16"/>
<text x="995.0" y="222" text-anchor="middle" class="lbl">5. Enforce Session</text>
<text x="995.0" y="248" text-anchor="middle" class="sub">Short session,</text>
<text x="995.0" y="266" text-anchor="middle" class="sub">least privilege,</text>
<text x="995.0" y="284" text-anchor="middle" class="sub">logging</text>
<rect x="500" y="410" width="210" height="110" class="box3" rx="16"/>
<text x="605.0" y="442" text-anchor="middle" class="lbl">6. Continuous Monitoring</text>
<text x="605.0" y="468" text-anchor="middle" class="sub">Re-evaluate risk and</text>
<text x="605.0" y="486" text-anchor="middle" class="sub">terminate access if</text>
<text x="605.0" y="504" text-anchor="middle" class="sub">posture changes</text>
<path d="M200,242.5 L250,242.5" class="arrow"/>
<path d="M420,242.5 L470,242.5" class="arrow"/>
<path d="M640,242.5 L690,242.5" class="arrow"/>
<path d="M860,242.5 L910,242.5" class="arrow"/>
<path d="M910,242.5 L710,465.0" class="arrow"/>
<text x="810.0" y="345.75" text-anchor="middle" class="note">telemetry</text>
<path d="M710,465.0 L690,242.5" class="arrow"/>
<text x="700.0" y="345.75" text-anchor="middle" class="note">adaptive risk</text>
</svg>