<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155" /></marker><style>.title{font:700 30px Arial;fill:#0f172a}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2;rx:16}.box2{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:16}.box3{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:16}.lbl{font:700 18px Arial;fill:#111827}.sub{font:14px Arial;fill:#334155}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.note{font:13px Arial;fill:#475569}</style></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="55" class="title">Zero Trust Access Architecture</text>
<rect x="40" y="130" width="190" height="115" class="box" rx="16"/>
<text x="135.0" y="162" text-anchor="middle" class="lbl">User / Workload</text>
<text x="135.0" y="188" text-anchor="middle" class="sub">Employee, contractor,</text>
<text x="135.0" y="206" text-anchor="middle" class="sub">service account, or</text>
<text x="135.0" y="224" text-anchor="middle" class="sub">workload identity</text>
<rect x="285" y="100" width="200" height="125" class="box2" rx="16"/>
<text x="385.0" y="132" text-anchor="middle" class="lbl">Identity Provider</text>
<text x="385.0" y="158" text-anchor="middle" class="sub">SSO, MFA, user</text>
<text x="385.0" y="176" text-anchor="middle" class="sub">attributes, groups,</text>
<text x="385.0" y="194" text-anchor="middle" class="sub">risk signals</text>
<rect x="285" y="270" width="200" height="125" class="box2" rx="16"/>
<text x="385.0" y="302" text-anchor="middle" class="lbl">Device Posture</text>
<text x="385.0" y="328" text-anchor="middle" class="sub">Managed device, health</text>
<text x="385.0" y="346" text-anchor="middle" class="sub">checks, EDR,</text>
<text x="385.0" y="364" text-anchor="middle" class="sub">compliance state</text>
<rect x="555" y="170" width="220" height="145" class="box3" rx="16"/>
<text x="665.0" y="202" text-anchor="middle" class="lbl">Policy Decision Point</text>
<text x="665.0" y="228" text-anchor="middle" class="sub">Evaluates identity,</text>
<text x="665.0" y="246" text-anchor="middle" class="sub">device, location, risk,</text>
<text x="665.0" y="264" text-anchor="middle" class="sub">data, and app context</text>
<rect x="840" y="170" width="180" height="145" class="box" rx="16"/>
<text x="930.0" y="202" text-anchor="middle" class="lbl">Policy Enforcement Point</text>
<text x="930.0" y="228" text-anchor="middle" class="sub">Proxy, gateway,</text>
<text x="930.0" y="246" text-anchor="middle" class="sub">agent, sidecar, or</text>
<text x="930.0" y="264" text-anchor="middle" class="sub">firewall enforcement</text>
<rect x="1080" y="100" width="90" height="100" class="box2" rx="16"/>
<text x="1125.0" y="132" text-anchor="middle" class="lbl">App</text>
<text x="1125.0" y="158" text-anchor="middle" class="sub">Private SaaS, API,</text>
<text x="1125.0" y="176" text-anchor="middle" class="sub">cloud app</text>
<rect x="1080" y="285" width="90" height="100" class="box2" rx="16"/>
<text x="1125.0" y="317" text-anchor="middle" class="lbl">Data</text>
<text x="1125.0" y="343" text-anchor="middle" class="sub">Files, DBs,</text>
<text x="1125.0" y="361" text-anchor="middle" class="sub">secrets, records</text>
<rect x="555" y="430" width="220" height="110" class="box" rx="16"/>
<text x="665.0" y="462" text-anchor="middle" class="lbl">Telemetry &amp; Analytics</text>
<text x="665.0" y="488" text-anchor="middle" class="sub">Logs, SIEM, UEBA, threat</text>
<text x="665.0" y="506" text-anchor="middle" class="sub">detection, continuous</text>
<text x="665.0" y="524" text-anchor="middle" class="sub">monitoring</text>
<path d="M230,187.5 L285,162.5" class="arrow"/>
<text x="257.5" y="167.0" text-anchor="middle" class="note">authenticate</text>
<path d="M230,187.5 L285,332.5" class="arrow"/>
<text x="257.5" y="252.0" text-anchor="middle" class="note">verify posture</text>
<path d="M485,162.5 L555,242.5" class="arrow"/>
<text x="520.0" y="194.5" text-anchor="middle" class="note">identity context</text>
<path d="M485,332.5 L555,242.5" class="arrow"/>
<text x="520.0" y="279.5" text-anchor="middle" class="note">device context</text>
<path d="M775,242.5 L840,242.5" class="arrow"/>
<text x="807.5" y="234.5" text-anchor="middle" class="note">allow / deny / step-up</text>
<path d="M1020,242.5 L1080,150.0" class="arrow"/>
<text x="1050.0" y="188.25" text-anchor="middle" class="note">least-privilege access</text>
<path d="M1020,242.5 L1080,335.0" class="arrow"/>
<text x="1050.0" y="280.75" text-anchor="middle" class="note">data-aware controls</text>
<path d="M840,242.5 L775,485.0" class="arrow"/>
<text x="807.5" y="355.75" text-anchor="middle" class="note">events</text>
<path d="M555,485.0 L775,242.5" class="arrow"/>
<text x="665.0" y="355.75" text-anchor="middle" class="note">risk feedback</text>
</svg>