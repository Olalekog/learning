<text x="750" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#16191F">Azure AD Identity</text>
<text x="750" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#545B64">(directory-based access control)</text>
<rect x="80" y="300" width="550" height="180" rx="4" fill="#FAFAFA" stroke="#605E5C" stroke-width="1.5"/>
<text x="90" y="318" font-size="11" font-weight="600" fill="#16191F">Subnet: Claims Applications</text>
<text x="90" y="345" font-size="10.5" fill="#545B64">NSG-isolated from Policy subnet — sensitive</text>
<text x="90" y="361" font-size="10.5" fill="#545B64">claims data has its own network boundary,</text>
<text x="90" y="377" font-size="10.5" fill="#545B64">not shared blast radius with Policy apps.</text>
<text x="90" y="405" font-size="10.5" fill="#545B64">Every new claims app follows this same</text>
<text x="90" y="421" font-size="10.5" fill="#545B64">baseline pattern from day one, instead of</text>
<text x="90" y="437" font-size="10.5" fill="#545B64">each team designing its own network/identity.</text>
<rect x="670" y="300" width="550" height="180" rx="4" fill="#FAFAFA" stroke="#605E5C" stroke-width="1.5"/>
<text x="680" y="318" font-size="11" font-weight="600" fill="#16191F">Subnet: Policy Applications</text>
<text x="680" y="345" font-size="10.5" fill="#545B64">Same baseline pattern, separate network</text>
<text x="680" y="361" font-size="10.5" fill="#545B64">boundary — the "first company-wide pattern"</text>
<text x="680" y="377" font-size="10.5" fill="#545B64">is the repeatability, not any single control.</text>
<text x="680" y="405" font-size="10.5" fill="#545B64">Both subnets consume the same Key Vault</text>
<text x="680" y="421" font-size="10.5" fill="#545B64">and identity foundation above — shared,</text>
<text x="680" y="437" font-size="10.5" fill="#545B64">not duplicated per app.</text>
<rect x="80" y="500" width="1140" height="110" rx="4" fill="#FAFAFA" stroke="#605E5C" stroke-width="1.5"/>
<text x="90" y="518" font-size="11" font-weight="600" fill="#16191F">Release Management</text>
<text x="90" y="540" font-size="10.5" fill="#545B64">Era's Azure DevOps tooling manages release/approval/environment promotion —</text>
<text x="90" y="556" font-size="10.5" fill="#545B64">bringing structure to how infrastructure and applications moved toward production,</text>
<text x="90" y="572" font-size="10.5" fill="#545B64">where none had existed before this pattern was established.</text>
<text x="90" y="595" font-size="10.5" fill="#545B64">Reliability support: improved monitoring + documented recovery steps for critical claims/policy platforms.</text>
