<text x="650" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#16191F">Liberty Mutual — First Company-Wide Azure Landing Zone</text>
<text x="650" y="56" font-size="13" text-anchor="middle" fill="#545B64">Deliberately Simpler Than Later Roles — the Earliest Version of This Career's Landing Zone Pattern — Insurance</text>
<rect x="60" y="90" width="1180" height="540" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text x="70" y="108" font-size="13" font-weight="700" text-anchor="start" fill="#0078D4">Azure — Single VNet (no hub-spoke yet — that maturity comes later, at Rivian/Regeneron/Truist)</text>
<rect x="80" y="130" width="1140" height="140" rx="4" fill="#F3F9FF" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="90" y="148" font-size="11" font-weight="600" fill="#0078D4">Shared Identity &amp; Secrets Foundation</text>
