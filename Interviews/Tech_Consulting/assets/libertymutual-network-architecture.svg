"0.28" fill="#ff9300" opacity="0.75" /><rect id="kv-bb12d31c-3352-4a18-87dd-a169a4a8721d" x="6.48" y="6.78" width="5.17" height="0.61" rx="0.28" fill="#ff9300" opacity="0.75" /></g></g>
<text x="400" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#16191F">Key Vault</text>
<text x="400" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#545B64">(secrets/keys, one per environment)</text>
